name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [image/**, test/**, .github/workflows/build.yml]
env:
  TAG: v0.16.0-r1
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build into the local daemon and run the contract test before anything is
      # pushed, so a broken wrapper never reaches the tag Railway deploys.
      - uses: docker/build-push-action@v6
        with:
          context: image
          load: true
          tags: ghcr.io/${{ github.repository }}/app:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash test/version.sh "${TAG%-r*}" "$TAG"
      - run: bash test/contract.sh ghcr.io/${{ github.repository }}/app:${{ env.TAG }}
      # Public repo + GITHUB_TOKEN push = anonymously pullable package, which is
      # exactly what Railway's puller needs. No visibility flip.
      - uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/app:${{ env.TAG }}
            ghcr.io/${{ github.repository }}/app:latest
          cache-from: type=gha
